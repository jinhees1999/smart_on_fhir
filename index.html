<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SMART on FHIR Immunizations Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
</head>
<body>
  <h1>SMART on FHIR: Patient Immunizations</h1>
  <h2>Immunization Records</h2>
  <pre id="immunizations">Loading...</pre>

  <script>
    FHIR.oauth2.ready().then(client => {
      const patientId = client.patient.id;
      client.request(`Immunization?patient=${patientId}&_count=50`)
        .then(bundle => {
          const entries = bundle.entry || [];
          const immunizations = entries.map(entry => entry.resource);
          document.getElementById("immunizations").textContent = JSON.stringify(immunizations, null, 2);
        })
        .catch(err => {
          console.error("Error fetching immunizations:", err);
          document.getElementById("immunizations").textContent = "Error loading immunizations.";
        });
    });
  </script>
</body>
</html>
