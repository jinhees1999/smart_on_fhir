<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Example SMART App</title>
        <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
        <style>
            #patient, #meds {
                font-family: Monaco, monospace;
                white-space: pre;
                font-size: 13px;
                height: 30vh;
                overflow: scroll;
                border: 1px solid #CCC;
            }
        </style>

        <script src="https://code.highcharts.com/highcharts.js"></script>
   
    </head>
    <body> 
        <h4>Current Patient</h4>
        <div id="patient">Loading...</div>
        <br/>
        <h4>Medications</h4>
        <div id="meds">Loading...</div>
        <script type="text/javascript">
            FHIR.oauth2.ready().then(function(client) {
                
                // Render the current patient (or any error)
                client.patient.read().then(
                    function(pt) {
                        document.getElementById("patient").innerText = JSON.stringify(pt, null, 4);
                    },
                    function(error) {
                        document.getElementById("patient").innerText = error.stack;
                    }
                );
                
                // Get MedicationRequests for the selected patient
                client.request("/MedicationRequest?patient=" + client.patient.id, {
                    resolveReferences: [ "medicationReference" ],
                    graph: true
                })
                
                // Reject if no MedicationRequests are found
                .then(function(data) {
                    if (!data.entry || !data.entry.length) {
                        throw new Error("No medications found for the selected patient");
                    }
                    return data.entry;
                })
                 

                // Render the current patient's medications (or any error)
                .then(
                    function(meds) {
                        document.getElementById("meds").innerText = JSON.stringify(meds, null, 4);
                    },
                    function(error) {
                        document.getElementById("meds").innerText = error.stack;
                    }
                );
		    
            }).catch(console.error);

 

// Function to fetch cholesterol tests for a specific patient from a FHIR server
async function fetchImmunizations(patientId) {
  const url = `https://hapi.fhir.org/baseR4/Immunization?patient=Patient/${patientId}&_count=50`;

  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    const bundle = await response.json();

    const immunizations = (bundle.entry || []).map(entry => entry.resource);
    document.getElementById("immunizations").textContent = JSON.stringify(immunizations, null, 2);
  } catch (error) {
    console.error("Error fetching immunizations:", error);
    document.getElementById("immunizations").textContent = "Error fetching immunizations.";
  }
}

document.getElementById("fetchImmunizations").addEventListener("click", () => {
  const patientId = document.getElementById("patientId").value;
  fetchImmunizations(patientId);
});
// Example usage: Fetch cholesterol tests for a patient with ID '12345'
fetchImmunizations().then(data => {
    console.log('Cholesterol Tests:', data);
});
		
		
	
	
	</script>
</body>
</html>
