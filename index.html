<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SMART FHIR App – Immunizations</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <style>
        #patient, #immunizations {
            font-family: Monaco, monospace;
            white-space: pre;
            font-size: 13px;
            height: 30vh;
            overflow: scroll;
            border: 1px solid #CCC;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h2>Current Patient</h2>
    <div id="patient">Loading patient...</div>

    <h2>Immunizations</h2>
    <div id="immunizations">Loading immunizations...</div>

	<h2>Allergies</h2>
  	<div id="allergies">Loading allergies...</div>

    <script>
        FHIR.oauth2.ready().then(async function(client) {
            try {
                const patient = await client.patient.read();
                document.getElementById("patient").textContent = JSON.stringify(patient, null, 2);

                const immunizationBundle = await client.request(`Immunization?patient=${patient.id}`);
                const immunizations = immunizationBundle.entry?.map(e => e.resource) || [];
                document.getElementById("immunizations").textContent = JSON.stringify(immunizations, null, 2);

		const allergyBundle = await client.request(`AllergyIntolerance?patient=${patient.id}`);
                const allergies = allergyBundle.entry?.map(e => e.resource) || [];
                document.getElementById("allergies").textContent = allergies.length ? 
                    JSON.stringify(allergies, null, 2) : "No allergies recorded for this patient.";


            } catch (err) {
                console.error(err);
                document.getElementById("patient").textContent = "Error: " + err.message;
                document.getElementById("immunizations").textContent = "Error fetching immunizations.";
		document.getElementById("allergies").textContent = "Error fetching allergies.";
            }
        }).catch(console.error);


 

// Function to fetch Immunizations for a specific patient from a FHIR server
async function fetchImmunizations(patientId) {
  const url = `https://hapi.fhir.org/baseR4/Immunization?patient=Patient/${patientId}&_count=50`;

  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    const bundle = await response.json();

    const immunizations = (bundle.entry || []).map(entry => entry.resource);
    document.getElementById("immunizations").textContent = JSON.stringify(immunizations, null, 2);
  } catch (error) {
    console.error("Error fetching immunizations:", error);
    document.getElementById("immunizations").textContent = "Error fetching immunizations.";
  }
}

document.getElementById("fetchImmunizations").addEventListener("click", () => {
  const patientId = document.getElementById("patientId").value;
  fetchImmunizations(patientId);
});
// Example usage: Fetch cholesterol tests for a patient with ID '12345'
fetchImmunizations().then(data => {
    console.log('Cholesterol Tests:', data);
});
		
		
	</script>

        <div id="container" style="width:100%; height:200px;"></div>
        
    </body>
</html>
