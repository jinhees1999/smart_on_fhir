<!DOCTYPE html>
<html>
    <head>
  <meta charset="UTF-8">
  <title>SMART Launch</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
</head>
<body>
  <p>Launching SMART on FHIR app...</p>
  <script>
    FHIR.oauth2.authorize({
      client_id: "my-smart-client-id", // Replace with your registered client ID
      scope: "launch openid fhirUser patient/Immunization.read",
      redirect_uri: "https://your-username.github.io/your-repo/index.html"
    });
  </script>
</body>
</html>
